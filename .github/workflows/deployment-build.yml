name: Deployment build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build all projects without provider-specific environment variables
        run: env -u PORT -u BASE_PATH pnpm build
      - name: Test both API deployment entrypoints
        run: pnpm --filter @workspace/api-server test:deployment
      - name: Test signal bot execution guards
        working-directory: artifacts/deriv-signal-lab
        run: node --experimental-strip-types --test tests/signal-bot-forge-gate.test.mjs tests/signal-bot.test.mjs tests/signal-bot-auto.test.mjs
