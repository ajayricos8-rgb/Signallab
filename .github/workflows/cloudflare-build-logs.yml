name: Cloudflare build logs

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Workers Builds build UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read the Workers Builds log
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '42df574fe432e05ff2cfbbf5896c8b11' }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_WORKERS_BUILDS_TOKEN || secrets.CF_WORKERS_BUILDS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_TOKEN}" ]; then
            echo "No Cloudflare API token secret is configured; the dashboard log must be supplied manually."
            exit 1
          fi
          response=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/builds/builds/${BUILD_ID}/logs")
          echo "${response}" | jq -r '
            if .success then
              (.result.lines[]? | .[1])
            else
              .errors[]? | "API error \(.code): \(.message)"
            end
          ' | tail -n 400
