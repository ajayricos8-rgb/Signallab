name: Cloudflare build validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dry-run:
    name: Build static Worker assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Use the supported Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Type-check and validate deployment configuration
        run: |
          npm run lint
          npm run check:deploy

      # Workers Builds can start in a production-only dependency environment.
      # Build from an empty node_modules directory to prove the dashboard's
      # common `npm run build` command restores Vite before invoking it.
      - name: Verify the production dependency build path
        run: |
          rm -rf node_modules
          NODE_ENV=production npm run build

      # This runs Wrangler's configured custom build and verifies that its
      # complete static assets directory can be packaged without credentials.
      - name: Package the Cloudflare Worker
        run: npx wrangler deploy --dry-run
