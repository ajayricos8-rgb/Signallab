kind = "web"
previewPath = "/"
title = "Deriv Signal Lab"
description = "A focused Deriv market analysis workspace for continuous indices, with configurable match, even/odd, over/under, and rise/fall signal views, transparent scoring, and risk-aware decision support."
version = "1.0.0"
id = "artifacts/deriv-signal-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18781

[services.development]
run = "pnpm --filter @workspace/deriv-signal-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deriv-signal-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/deriv-signal-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18781"
BASE_PATH = "/"
